name: formato
version: '1.0.0'
title: Formato
summary: Universal data converter for 60+ formats
description: |
  Universal data converter for 60+ formats — JSON, YAML, XML, CSV, images, audio, video.
  Features speech synthesis (TTS), speech recognition (STT), and a beautiful modern UI.
  Built with Rust + Svelte + Tauri. 100% local, no uploads, no limits.
license: MIT
contact: https://github.com/App-Lab-Hub/formato/issues
website: https://github.com/App-Lab-Hub/formato
source-code: https://github.com/App-Lab-Hub/formato
issues: https://github.com/App-Lab-Hub/formato/issues

grade: stable
confinement: strict
base: core24
compression: xz

apps:
  formato:
    command: usr/bin/formato
    desktop: usr/share/applications/Formato.desktop
    extensions: [gnome]
    environment:
      SAL_USE_VCLPLUGIN: headless
      APPIMAGE_EXTRACT_AND_RUN: "1"
      PATH: $SNAP/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/usr/lib/libreoffice_app/opt/libreoffice26.8/program:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/usr/lib/x86_64-linux-gnu/oss4-libsalsa:$SNAP/usr/lib/x86_64-linux-gnu/blas:$SNAP/usr/lib/x86_64-linux-gnu/lapack:$SNAP/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
      PIPER_ESPEAKNG_DATA_DIRECTORY: $SNAP/usr/lib/x86_64-linux-gnu
    plugs:
      - network

  soffice:
    command: usr/lib/libreoffice_app/AppRun
    environment:
      SAL_USE_VCLPLUGIN: headless
      APPIMAGE_EXTRACT_AND_RUN: "1"
      LD_LIBRARY_PATH: $SNAP/usr/lib/libreoffice_app/opt/libreoffice26.8/program:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/usr/lib/x86_64-linux-gnu/oss4-libsalsa:$SNAP/usr/lib/x86_64-linux-gnu/blas:$SNAP/usr/lib/x86_64-linux-gnu/lapack:$SNAP/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH

layout:
  /usr/bin/soffice:
    symlink: $SNAP/usr/lib/libreoffice_app/AppRun
  /usr/bin/ffmpeg:
    symlink: $SNAP/usr/bin/ffmpeg

lint:
  ignore:
    - library

parts:
  build-app:
    plugin: dump
    source: https://github.com/App-Lab-Hub/formato
    source-type: git
    source-tag: '1.0.0'
    build-snaps:
      - node/22/stable
      - rustup/latest/stable
    build-packages:
      - cmake
      - g++
      - gcc
      - clang
      - libclang-dev
      - llvm
      - libunistring-dev
      - libdav1d-dev
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg
      - pkg-config
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libstdc++6
      - libdav1d7
      - ffmpeg
      - espeak-ng-data
    override-build: |
      set -eu
      export CC=/usr/bin/gcc
      export CXX=/usr/bin/g++
      export LIBCLANG_PATH=$(llvm-config --libdir)
      export npm_config_cache="$CRAFT_PART_SRC/.npm-cache"

      OLD_LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
      export LD_LIBRARY_PATH=""
      rustup default stable
      export LD_LIBRARY_PATH="$OLD_LD_LIBRARY_PATH"

      npm ci --registry=https://npmmirror.com --no-audit --loglevel verbose || \
      npm install --registry=https://npmmirror.com --no-audit --loglevel verbose

      export LD_LIBRARY_PATH=""
      npm run tauri build -- --bundles deb
      export LD_LIBRARY_PATH="$OLD_LD_LIBRARY_PATH"

      dpkg -x src-tauri/target/release/bundle/deb/*.deb $CRAFT_PART_INSTALL/
      sed -i -e "s|Icon=formato|Icon=/usr/share/icons/hicolor/32x32/apps/formato.png|g" $CRAFT_PART_INSTALL/usr/share/applications/Formato.desktop

  libreoffice-runtime:
    plugin: dump
    source: https://appimages.libreitalia.org/LibreOffice-26.8.standard-x86_64.AppImage
    source-type: file
    override-prime: |
      craftctl default

      mkdir -p usr/bin
      mkdir -p usr/lib

      APPIMAGE_FILE=$(find $CRAFT_PART_SRC -name "*.AppImage" | head -n 1)
      chmod +x "$APPIMAGE_FILE"
      "$APPIMAGE_FILE" --appimage-extract

      rm -rf usr/lib/libreoffice_app
      mv squashfs-root usr/lib/libreoffice_app
      chmod +x usr/lib/libreoffice_app/AppRun

      LO=$CRAFT_PRIME/usr/lib/libreoffice_app/opt/libreoffice26.8

      # 🔥 ПАПКУ program НЕ ТРОГАЕМ ВООБЩЕ!

      # 🔥 Удаляем лицензии и presets
      rm -f $LO/CREDITS.fodt
      rm -f $LO/LICENSE
      rm -f $LO/LICENSE.html
      rm -f $LO/NOTICE
      rm -rf $LO/presets

      # 🔥 Удаляем help и readmes
      rm -rf $LO/help
      rm -rf $LO/readmes

      # 🔥 Удаляем БЕЗОПАСНЫЕ папки из share
      rm -rf $LO/share/autocorr
      rm -rf $LO/share/autotext
      rm -rf $LO/share/basic
      rm -rf $LO/share/classification
      rm -rf $LO/share/fingerprint
      rm -rf $LO/share/glade
      rm -rf $LO/share/labels
      rm -rf $LO/share/palette
      rm -rf $LO/share/psprint
      rm -rf $LO/share/Scripts
      rm -rf $LO/share/theme_definitions
      rm -rf $LO/share/themes
      rm -rf $LO/share/tipoftheday
      rm -rf $LO/share/toolbarmode
      rm -rf $LO/share/wizards
      rm -rf $LO/share/wordbook
      rm -rf $LO/share/xdg
      rm -rf $LO/share/gallery
      rm -rf $LO/share/fonts
      rm -rf $LO/share/template

      # 🔥 ОСТАВЛЯЕМ: config, extensions (dict-*), filter, registry, xslt, dtd,
      # liblangtag, libreofficekit, numbertext, skia, svx, xpdfimport, calc, firebird

      rm -f source

  cleanup:
    after:
      - build-app
      - libreoffice-runtime
    plugin: nil
    build-snaps:
      - core24
      - gnome-46-2404
    override-prime: |
      set -eux
      for snap in "core24" "gnome-46-2404"; do
        cd "/snap/$snap/current" && find . -type f,l -exec rm -f "$CRAFT_PRIME/{}" \;
      done


