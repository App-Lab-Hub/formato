id: com.applabhub.formato
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk  
command: formato
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
build-options:
  append-path: /usr/lib/sdk/llvm/bin:/usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
modules:
  - name: piper-binary
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
        sha256: a50cb45f355b7af1f6d758c1b360717877ba0a398cc8cbe6d2a7a3a26e225992
    build-commands:
      - mkdir -p /app/bin /app/lib /app/share
      - echo "📦 Установка Piper..."
      - install -Dm755 piper /app/bin/piper
      - install -m755 libonnxruntime.so.1.14.1 /app/lib/
      - install -m755 libpiper_phonemize.so.1.2.0 /app/lib/
      - install -m755 libespeak-ng.so.1.52.0.1 /app/lib/
      - ln -sf libonnxruntime.so.1.14.1 /app/lib/libonnxruntime.so
      - ln -sf libpiper_phonemize.so.1.2.0 /app/lib/libpiper_phonemize.so
      - ln -sf libespeak-ng.so.1.52.0.1 /app/lib/libespeak-ng.so
      - cp -r espeak-ng-data /app/share/
      - echo "✅ Piper установлен"

  - name: formato
    buildsystem: simple
    build-options:
      env:
        HOME: /run/build/formato
        CARGO_HOME: /run/build/formato/src-tauri
        XDG_CACHE_HOME: /run/build/formato/flatpak-node/cache
        npm_config_cache: /run/build/formato/flatpak-node/npm-cache
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        BINDGEN_EXTRA_CLANG_ARGS: "-idirafter /usr/lib/sdk/llvm20/lib/clang/20/include"
        WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        WEBKIT_DISABLE_COMPOSITING_MODE: "1"
    sources:
      - type: git
        url: https://github.com/App-Lab-Hub/formato.git
        tag: 1.0.0
      - cargo-sources.json
      - node-sources.json
    build-commands:
      - echo "=================================================="
      - echo "🔍 ПРОВЕРКА КОНФИГУРАЦИИ"
      - echo "=================================================="
      - echo "📁 Текущая директория: $(pwd)"
      
      - echo "=================================================="
      - echo "📦 НАСТРОЙКА CARGO"
      - echo "=================================================="
      - mkdir -p src-tauri/.cargo
      - echo -e '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "/run/build/formato/cargo/vendor"' > src-tauri/.cargo/config.toml
      
      - echo "=================================================="
      - echo "📦 УСТАНОВКА NPM ЗАВИСИМОСТЕЙ"
      - echo "=================================================="
      - npm install --offline --no-audit --no-fund
      
      - echo "=================================================="
      - echo "🦀 СБОРКА RUST (FLATPAK РЕЖИМ)"
      - echo "=================================================="
      - echo "🔧 Используем: RUSTFLAGS=\"--cfg flatpak\" npm run tauri build -- -b deb"
      - RUSTFLAGS="--cfg flatpak" npm run tauri build -- -b deb
      
      - echo "=================================================="
      - echo "📦 РАСПАКОВКА .DEB ПАКЕТА"
      - echo "=================================================="
      - ar -x src-tauri/target/release/bundle/deb/*.deb
      - tar -xf data.tar.gz
      
      - echo "=================================================="
      - echo "📦 ПАТЧИНГ .DESKTOP ФАЙЛА"
      - echo "=================================================="
      - # Исправляем Icon в .desktop файле
      - sed -i 's/Icon=formato/Icon=com.applabhub.formato/g' usr/share/applications/Formato.desktop
      - echo "✅ .desktop файл исправлен"
      
      - echo "=================================================="
      - echo "📦 УСТАНОВКА БИНАРНИКОВ В /app"
      - echo "=================================================="
      - install -Dm755 usr/bin/formato /app/bin/formato
      - install -Dm644 usr/share/applications/Formato.desktop /app/share/applications/com.applabhub.formato.desktop
      
      - echo "=================================================="
      - echo "📦 УСТАНОВКА ИКОНОК"
      - echo "=================================================="
      - # Создаем папки для всех размеров
      - mkdir -p /app/share/icons/hicolor/32x32/apps
      - mkdir -p /app/share/icons/hicolor/128x128/apps
      - mkdir -p /app/share/icons/hicolor/256x256@2/apps
      
      - # Устанавливаем иконки, переименовывая их в App ID
      - install -m644 usr/share/icons/hicolor/32x32/apps/formato.png /app/share/icons/hicolor/32x32/apps/com.applabhub.formato.png
      - install -m644 usr/share/icons/hicolor/128x128/apps/formato.png /app/share/icons/hicolor/128x128/apps/com.applabhub.formato.png
      - install -m644 usr/share/icons/hicolor/256x256@2/apps/formato.png /app/share/icons/hicolor/256x256@2/apps/com.applabhub.formato.png
      - echo "✅ Иконки установлены с правильными именами"

      - echo "=================================================="
      - echo "📦 УСТАНОВКА METAINFO"
      - echo "=================================================="
      - install -Dm644 usr/share/metainfo/com.applabhub.formato.metainfo.xml /app/share/metainfo/com.applabhub.formato.metainfo.xml
      
      - echo "=================================================="
      - echo "📁 ПРОВЕРКА УСТАНОВЛЕННЫХ ФАЙЛОВ"
      - echo "=================================================="
      - echo "📁 /app/bin/:"
      - ls -la /app/bin/ 2>/dev/null || echo "⚠️ Папка /app/bin/ не найдена!"
      - echo "📁 /app/share/applications/:"
      - ls -la /app/share/applications/ 2>/dev/null || echo "⚠️ Папка /app/share/applications/ не найдена!"
      - echo "📁 /app/share/icons/hicolor/128x128/apps/:"
      - ls -la /app/share/icons/hicolor/128x128/apps/ 2>/dev/null || echo "⚠️ Папка не найдена!"
      - echo "📁 /app/share/metainfo/:"
      - ls -la /app/share/metainfo/ 2>/dev/null || echo "⚠️ Папка /app/share/metainfo/ не найдена!"
      
      - echo "=================================================="
      - echo "✅ СБОРКА ЗАВЕРШЕНА"
      - echo "=================================================="
