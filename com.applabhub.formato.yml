id: com.applabhub.formato
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: formato
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network # Resolve for download ONNX,bin-models( piper, whisper ) from network
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=ESPEAK_DATA_PATH=/app/share/espeak-ng-data
  - --talk-name=org.freedesktop.portal.Desktop

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20

build-options:
  append-path: /usr/lib/sdk/llvm/bin:/usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin

modules:
  # ============================================================
  #  LibreOffice (Only Writer и Calc)
  # ============================================================
  - name: libreoffice-app-ext
    buildsystem: simple
    sources:
      - type: archive
        url: https://download.documentfoundation.org/libreoffice/stable/26.8.0/deb/x86_64/LibreOffice_26.8.0_Linux_x86-64_deb.tar.gz
        sha256: d0a6031a3837e48f9854e6d2da6489b9fadbd814afa4741fa32a197741663a22
    build-commands:
      # 1. Create target dir
      - mkdir -p /app/libreoffice
      
      # 2. Writer и Calc
      - |
        for p in core images ooofonts en-us writer calc ure libreoffice26.8_; do
          for f in DEBS/*"$p"*.deb; do
            if [ -f "$f" ]; then
              ar x "$f" data.tar.xz && tar -xf data.tar.xz -C /app/libreoffice && rm data.tar.xz
            fi
          done
        done

      # 3. simplinks PATH
      - mkdir -p /app/bin
      - ln -sf /app/libreoffice/opt/libreoffice*/program/soffice /app/bin/soffice


  # ============================================================
  # Piper TTS
  # ============================================================
  - name: piper-binary
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
        sha256: a50cb45f355b7af1f6d758c1b360717877ba0a398cc8cbe6d2a7a3a26e225992
    build-commands:
      - mkdir -p /app/bin /app/lib /app/share/espeak-ng-data

      - install -Dm755 piper /app/bin/piper
      - install -Dm755 piper_phonemize /app/bin/piper_phonemize

      - cp -P *.so* /app/lib/

      - cp -r espeak-ng-data/* /app/share/espeak-ng-data/

    build-options:
      env:
        - LD_LIBRARY_PATH: /app/lib

  # ============================================================
  # Main
  # ============================================================
  - name: formato
    buildsystem: simple
    build-options:
      env:
        HOME: /run/build/formato
        CARGO_HOME: /run/build/formato/src-tauri
        XDG_CACHE_HOME: /run/build/formato/flatpak-node/cache
        npm_config_cache: /run/build/formato/flatpak-node/npm-cache
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        BINDGEN_EXTRA_CLANG_ARGS: "-idirafter /usr/lib/sdk/llvm20/lib/clang/20/include"
    sources:
      - type: git
        url: https://github.com/App-Lab-Hub/formato.git
        tag: 1.0.0
      - cargo-sources.json
      - node-sources.json
    build-commands:

      - mkdir -p src-tauri/.cargo

      - npm install --offline --no-audit --no-fund
      #      - RUSTFLAGS="--cfg flatpak" npm run tauri build -- -b deb
      - RUSTFLAGS="--cfg flatpak" npm run tauri build -- --debug -b deb
      #      - ar -x src-tauri/target/release/bundle/deb/*.deb
      - ar -x src-tauri/target/debug/bundle/deb/*.deb
      - tar -xf data.tar.gz

      - sed -i 's/Icon=formato/Icon=com.applabhub.formato/g' usr/share/applications/Formato.desktop

      - install -Dm755 usr/bin/formato /app/bin/formato
      - install -Dm644 usr/share/applications/Formato.desktop /app/share/applications/com.applabhub.formato.desktop

      - mkdir -p /app/share/icons/hicolor/32x32/apps
      - mkdir -p /app/share/icons/hicolor/128x128/apps
      - mkdir -p /app/share/icons/hicolor/256x256@2/apps
      - install -m644 usr/share/icons/hicolor/32x32/apps/formato.png /app/share/icons/hicolor/32x32/apps/com.applabhub.formato.png
      - install -m644 usr/share/icons/hicolor/128x128/apps/formato.png /app/share/icons/hicolor/128x128/apps/com.applabhub.formato.png
      - install -m644 usr/share/icons/hicolor/256x256@2/apps/formato.png /app/share/icons/hicolor/256x256@2/apps/com.applabhub.formato.png

      - install -Dm644 usr/share/metainfo/com.applabhub.formato.metainfo.xml /app/share/metainfo/com.applabhub.formato.metainfo.xml

