<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #060608;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        opacity: 1;
        transition: opacity 0.6s ease-out;
      }
      body.fade-out {
        opacity: 0 !important;
        filter: blur(20px);
        transition:
          opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1),
          filter 1.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .bg-radial-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 0, 0, 0.7) 100%
        );
        opacity: 0.9;
      }

      /* Северное сияние слева */
      .aurora-left {
        position: absolute;
        left: -15%;
        top: 5%;
        width: 55%;
        height: 90%;
        background:
          radial-gradient(
            ellipse at 30% 40%,
            rgba(96, 165, 250, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 45% 55%,
            rgba(168, 85, 247, 0.12) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 25% 65%,
            rgba(6, 182, 212, 0.08) 0%,
            transparent 40%
          );
        filter: blur(100px);
        opacity: 0;
        animation: auroraPulse 8s ease-in-out 1s infinite;
        transform: skewY(-5deg);
      }

      .shimmer-right {
        position: absolute;
        right: 0;
        top: 25%;
        width: 4px;
        height: 240px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(96, 165, 250, 0.6),
          rgba(139, 92, 246, 0.4),
          transparent
        );
        border-radius: 2px;
        opacity: 0;
        animation: shimmerMain 6s ease-in-out 0.5s infinite;
        box-shadow:
          0 0 16px rgba(96, 165, 250, 0.4),
          0 0 32px rgba(139, 92, 246, 0.2);
      }
      .shimmer-right2 {
        position: absolute;
        right: 10px;
        top: 35%;
        width: 1.5px;
        height: 180px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(168, 85, 247, 0.5),
          rgba(236, 72, 153, 0.3),
          transparent
        );
        border-radius: 1px;
        opacity: 0;
        animation: shimmerSecond 4s ease-in-out 2s infinite;
        box-shadow:
          0 0 10px rgba(168, 85, 247, 0.35),
          0 0 20px rgba(236, 72, 153, 0.15);
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(140px);
      }
      .glow-1 {
        width: 700px;
        height: 700px;
        background: rgba(59, 130, 246, 0.03);
        opacity: 0;
        animation: pulseGlow 6s ease-in-out 0.2s infinite;
      }
      .glow-2 {
        width: 450px;
        height: 450px;
        background: rgba(168, 85, 247, 0.05);
        top: 30%;
        left: 20%;
        opacity: 0;
        animation: pulseGlow 6s ease-in-out 0.4s infinite;
      }
      .glow-3 {
        width: 350px;
        height: 350px;
        background: rgba(6, 182, 212, 0.03);
        bottom: 20%;
        right: 20%;
        opacity: 0;
        animation: pulseGlow 6s ease-in-out 0.6s infinite;
      }

      .meteor {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        transform: rotate(215deg);
        animation: meteor var(--duration) linear var(--delay) infinite;
      }
      .meteor::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 60px;
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.12),
          transparent
        );
        transform: translateY(-50%);
      }

      .content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 48px;
      }

      .logo-wrapper {
        position: relative;
      }
      .logo-glow {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6, #a855f7, #3b82f6);
        filter: blur(56px);
        opacity: 0;
        animation:
          spin 35s linear infinite,
          pulseGlow 6s ease-in-out 0.3s infinite;
      }
      .logo-inner {
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        background: linear-gradient(135deg, #60a5fa, #c084fc);
        filter: blur(40px);
        opacity: 0;
        animation: pulseGlow 6s ease-in-out 0.5s infinite;
      }

      .logo-svg {
        position: relative;
        width: 128px;
        height: 128px;
      }

      .bracket {
        fill: none;
        stroke: url(#grad);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 150;
        stroke-dashoffset: 150;
        opacity: 0;
        filter: url(#glow-filter);
        animation:
          draw 3s linear 0.4s forwards,
          fadeBracket 1.5s ease-out 0.4s forwards;
      }

      h1 {
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 0.35em;
        text-transform: uppercase;
      }
      h1 span {
        background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
        filter: blur(8px);
        animation: reveal 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      }

      .subtitle {
        text-align: center;
        opacity: 0;
        animation: fadeUp 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 4.5s forwards;
      }
      .subtitle p {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.35em;
        text-transform: uppercase;
      }
      .subtitle span {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.2);
        font-family: monospace;
      }

      .progress {
        width: 288px;
        height: 1px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 9999px;
        overflow: hidden;
        opacity: 0;
        animation: fadeUp 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 5.5s forwards;
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #a855f7, #ec4899);
        border-radius: 9999px;
        transform-origin: left;
        animation: progress 6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes pulseGlow {
        0% {
          opacity: 0;
        }
        20% {
          opacity: 0.15;
        }
        50% {
          opacity: 0.2;
        }
        80% {
          opacity: 0.08;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes auroraPulse {
        0% {
          opacity: 0.3;
          transform: skewY(-5deg) scale(1);
        }
        25% {
          opacity: 0.6;
          transform: skewY(-3deg) scale(1.08);
        }
        50% {
          opacity: 0.35;
          transform: skewY(-7deg) scale(0.95);
        }
        75% {
          opacity: 0.7;
          transform: skewY(-4deg) scale(1.05);
        }
        100% {
          opacity: 0.3;
          transform: skewY(-5deg) scale(1);
        }
      }
      @keyframes shimmerMain {
        0% {
          opacity: 0;
        }
        30% {
          opacity: 0.7;
        }
        60% {
          opacity: 0.1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes shimmerSecond {
        0% {
          opacity: 0;
        }
        25% {
          opacity: 0.05;
        }
        50% {
          opacity: 0.65;
        }
        75% {
          opacity: 0.1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes draw {
        from {
          stroke-dashoffset: 150;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes fadeBracket {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes reveal {
        from {
          opacity: 0;
          filter: blur(10px);
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          filter: blur(0px);
          transform: translateY(0);
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes progress {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes meteor {
        0% {
          transform: rotate(215deg) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        70% {
          opacity: 0.3;
        }
        100% {
          transform: rotate(215deg) translateX(-700px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-radial-vignette"></div>
    <div class="aurora-left"></div>
    <div class="shimmer-right"></div>
    <div class="shimmer-right2"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <script>
      for (let i = 0; i < 40; i++) {
        const m = document.createElement("div");
        m.className = "meteor";
        m.style.setProperty("--delay", Math.random() * 6 + "s");
        m.style.setProperty("--duration", Math.random() * 10 + 8 + "s");
        m.style.left =
          Math.random() < 0.7
            ? Math.random() * 55 + "vw"
            : 40 + Math.random() * 60 + "vw";
        m.style.top = Math.random() * -20 - 5 + "px";
        const colors = ["#60a5fa", "#a78bfa", "#a855f7", "#60a5fa"];
        m.style.background = colors[i % 4];
        document.body.appendChild(m);
      }
    </script>

    <div class="content">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <div class="logo-inner"></div>
        <svg class="logo-svg" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#60a5fa" />
              <stop offset="50%" stop-color="#a78bfa" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
            <filter
              id="glow-filter"
              x="-50%"
              y="-50%"
              width="200%"
              height="200%"
            >
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path
            class="bracket"
            d="M48 22 Q36 22 36 34 L36 46 Q36 54 24 54 Q36 54 36 62 L36 74 Q36 86 48 86"
          />
          <path
            class="bracket"
            d="M72 22 Q84 22 84 34 L84 46 Q84 54 96 54 Q84 54 84 62 L84 74 Q84 86 72 86"
          />
        </svg>
      </div>

      <h1>
        <span style="animation-delay: 1.5s">F</span>
        <span style="animation-delay: 1.7s">O</span>
        <span style="animation-delay: 1.9s">R</span>
        <span style="animation-delay: 2.1s">M</span>
        <span style="animation-delay: 2.3s">A</span>
        <span style="animation-delay: 2.5s">T</span>
        <span style="animation-delay: 2.7s">O</span>
      </h1>

      <div class="subtitle">
        <p>Universal Data Converter</p>
        <span>v0.1.0</span>
      </div>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>
  </body>
</html>
