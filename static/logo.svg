<svg
  class="w-16 h-16 sm:w-20 sm:h-20"
  viewBox="0 0 64 64"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Внешнее кольцо -->
  <circle
    cx="32"
    cy="32"
    r="28"
    stroke="url(#logoGrad)"
    stroke-width="2.5"
    opacity="0.3"
  />
  <!-- Основной шестигранник -->
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64">
      <stop stop-color="oklch(0.58 0.22 300)" />
      <stop offset="1" stop-color="oklch(0.38 0.12 300)" />
    </linearGradient>
    <linearGradient id="logoGradInner" x1="0" y1="64" x2="64" y2="0">
      <stop stop-color="oklch(0.68 0.22 300)" />
      <stop offset="1" stop-color="oklch(0.48 0.17 300)" />
    </linearGradient>
  </defs>
  <polygon
    points="32,10 50,20 50,44 32,54 14,44 14,20"
    fill="url(#logoGradInner)"
    opacity="0.15"
    stroke="url(#logoGrad)"
    stroke-width="1.5"
  />
  <!-- Стрелка вправо внутри -->
  <path
    d="M24 32 L30 38 L42 26"
    stroke="url(#logoGrad)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Точка слева -->
  <circle cx="18" cy="32" r="2.5" fill="url(#logoGrad)" />
  <!-- Точка справа -->
  <circle cx="46" cy="32" r="2.5" fill="url(#logoGrad)" />
</svg>
