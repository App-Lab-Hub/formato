[package]
name = "formato"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "formato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
serde_ini = "0.2.0"
quick-xml = { version = "0.40.1", features = ["serialize"] }
toml = "1.1.2"
csv = "1.4.0"
serde_yaml = "0.9.34"
dirs = "6.0.0"
opener = "0.8.4"
tokio = {version="1.52.3",features= ["time"] }
tauri-plugin-fs = "2.5.1"
scraper = "0.27.0"
pulldown-cmark = "0.13.4"
json2csv = "0.2.0"
md_gen = "0.1.0"
flatten-json-object = "0.6.1"
xml2json-rs = "1.0.1"
rust-ini = "0.21.3"
handlebars = "6.4.1"
nalgebra = "0.35.0"
json-unflattening = "0.1.5"
serde-flattened = "0.1.1"
indexmap = { version = "2.14.0", features = ["serde"] }
sea-orm = { version = "2.0.0-rc", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "debug-print"] }
chrono = "0.4.45"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
memmap2 = "0.9.11"
zippylib = "0.1.0"
bytes = "1.12.1"
docx-rs = "0.4.20"
rust_xlsxwriter = "0.96.0"
rtf-parser = "0.4.3"
zip = "8.6.0"
calamine = "0.36.0"
pdf-extract = "0.12.0"
encoding_rs = "0.8.35"
tempfile = "3.27.0"
office_oxide = "0.1.7"
image = { version = "0.25.5", features = ["avif", "webp", "jpeg", "png", "gif", "bmp", "tiff", "ico", "avif-native"] }
ffmpeg-sidecar = "2.5.2"
base64 = "0.23.0"
kamadak-exif = "0.6.1"
piper-rs = "0.2.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
anyhow = "1.0.104"
hound = "3.5.1"
lo_writer = "0.5.2"
oxiwhisper = { version = "0.1.2", features = ["parallel"] }
transcribe-rs = { version = "0.3.11", features = ["whisper-cpp"] }

